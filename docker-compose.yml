services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    # DB_* intentionally not set here (backend/.env already has them):
    # setting them as real container env vars puts them in $_SERVER, which
    # phpunit.xml's <env force="true"> cannot override (it only touches
    # getenv()/$_ENV) — RefreshDatabase would then run against this
    # container's real Postgres instead of the test sqlite connection.
    environment:
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000
      SESSION_COOKIE: blog_session
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Relative so the browser calls this app's own origin; next.config.ts
      # proxies /api and /sanctum through to API_URL below. See the comment
      # there for why (cross-host cookies can't be read via document.cookie).
      NEXT_PUBLIC_API_URL: /api
      API_URL: http://backend:8000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SESSION_COOKIE_NAME: blog_session
    depends_on:
      - backend

volumes:
  db_data:
